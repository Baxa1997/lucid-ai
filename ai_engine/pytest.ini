# pytest configuration for ai_engine.
#
# Marker convention (enforced via --strict-markers below):
#   • unit         — pure unit tests, no network / no DB / no live API
#   • integration  — mock-based pipeline tests
#   • e2e          — hits a live API (Claude, Gemini, Vertex, Stripe). NOT
#                    auto-skipped — opt in/out via `-m` selectors so a test
#                    run is explicit about what it costs.
#   • ws           — WebSocket contract / trace replay tests
#
# Default test discovery EXCLUDES the file-name-based live-API tests at the
# ai_engine/ root so a no-keys baseline run (`pytest`) gets a clean signal.
# Run the e2e suite explicitly with: `pytest -o testpaths=. e2e_tests/`

[pytest]
testpaths = tests
addopts = -q --strict-markers -p no:cacheprovider
asyncio_mode = auto
markers =
    unit: pure unit tests (no network, no DB, no live API)
    integration: mock-based pipeline tests
    e2e: live API tests (Claude / Gemini / Vertex / Stripe) — costs money to run
    live: live infra tests (real Supabase, real Unsplash). Auto-skip when env missing. Pre-existing convention; keep for backward compat.
    ws: WebSocket contract and trace-replay tests
    slow: long-running tests (>5s)
    asyncio: pytest-asyncio test markers (third-party plugin)

# Quiet legacy DeprecationWarnings during baseline runs so the failure list
# isn't drowned out by upstream pluggy / asyncio warnings we can't fix.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
