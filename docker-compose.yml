services:
  frontend:
    build:
      context: ./frontend
    pull_policy: missing
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://ai_engine:8000
      - PYTHON_BACKEND_URL=http://ai_engine:8000
      - AI_SERVICE_URL=http://ai_engine:8000
      - AI_SERVICE_WS_URL=ws://ai_engine:8000
      # Local dev defaults to the host port mapping (browser → docker → ai_engine).
      # Override per-env: server docker-compose sets wss://lucid.shopsready.com/api/v1/ws;
      # Vercel deploys read this from their own dashboard env vars (docker-compose
      # is irrelevant on Vercel). Set it in the root .env to override locally.
      - NEXT_PUBLIC_AGENT_WS_URL=${NEXT_PUBLIC_AGENT_WS_URL:-ws://localhost:8000/api/v1/ws}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=http://localhost:3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # ── Stripe ─────────────────────────────────────────
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Subscription tiers (monthly only)
      - STRIPE_STARTER_MONTHLY_PRICE_ID=${STRIPE_STARTER_MONTHLY_PRICE_ID}
      - STRIPE_PRO_MONTHLY_PRICE_ID=${STRIPE_PRO_MONTHLY_PRICE_ID}
      - STRIPE_ENTERPRISE_MONTHLY_PRICE_ID=${STRIPE_ENTERPRISE_MONTHLY_PRICE_ID}
      # One-time credit packs
      - STRIPE_CREDIT_PACK_SMALL_PRICE_ID=${STRIPE_CREDIT_PACK_SMALL_PRICE_ID}
      - STRIPE_CREDIT_PACK_MEDIUM_PRICE_ID=${STRIPE_CREDIT_PACK_MEDIUM_PRICE_ID}
      - STRIPE_CREDIT_PACK_LARGE_PRICE_ID=${STRIPE_CREDIT_PACK_LARGE_PRICE_ID}
      # ── App URL (for Stripe redirect) ──────────────────
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # ── Admin access ───────────────────────────────────
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # ── Platform deployment (Lucid-owned GitHub org + Vercel team) ──
      # Used by /api/publish — pushes generated repos to our org and
      # creates Vercel projects so deploys are auto-triggered on main pushes.
      - PLATFORM_GITHUB_TOKEN=${PLATFORM_GITHUB_TOKEN}
      - PLATFORM_GITHUB_ORG=${PLATFORM_GITHUB_ORG}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
      - VERCEL_TEAM_ID=${VERCEL_TEAM_ID:-}
    depends_on:
      - ai_engine
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  ai_engine:
    build:
      context: ./ai_engine
    pull_policy: missing
    ports:
      - "8000:8000"
      - "6080:6080"
      # Local dev server port range — one port per active preview session
      # Caddy/nginx routes *.preview.yourdomain.com → host:{port} in production
      - "4000-4050:4000-4050"
    volumes:
      - ./ai_engine:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount (not named volume) so the Docker daemon can resolve
      # the host-side path when creating per-session sandbox containers.
      - ${PWD}/workspaces:/app/storage
      # ── Vertex AI auth (gcloud ADC) ─────────────────────────
      # Copy your local ADC to secrets/ with:
      #   scp ~/.config/gcloud/application_default_credentials.json \
      #       user@server:/opt/lucid-ai/secrets/gcloud-adc.json
      # The file is mounted at exactly the path google-auth looks for ADC.
      # No GOOGLE_APPLICATION_CREDENTIALS env var needed — google.auth.default()
      # finds it automatically at /root/.config/gcloud/application_default_credentials.json.
      # Refresh locally with `gcloud auth application-default login` then re-scp.
      - ./secrets/gcloud-adc.json:/root/.config/gcloud/application_default_credentials.json:ro
      # Persist the pnpm content-addressable store across container restarts so
      # the second/third preview install hits the cache instead of re-downloading
      # ~600MB of Next.js + Tailwind + shadcn deps. Without this, every fresh
      # container loses the warm cache and installs blow past 5 min.
      - pnpm_store:/tmp/pnpm_store
      - npm_cache:/tmp/npm_cache
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=.
      - PORT=8000
      - DISPLAY=:99
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # JWT secret from Supabase Dashboard → Settings → API → JWT Settings
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # service_role key — bypasses RLS; server-to-server use only
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Internal path where workspaces live inside the ai_engine container
      - WORKSPACE_BASE_PATH=/app/storage
      # Host-side path the Docker daemon uses for sandbox bind mounts.
      # Must match the left-hand side of the volume mount above.
      - HOST_WORKSPACE_PATH=${PWD}/workspaces
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # ── Vertex AI (Google Cloud) ─────────────────────────
      # When USE_VERTEX_AI=true, all Gemini calls route to Vertex via ADC
      # (mounted from host above). Set in .env to flip on.
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      # DO NOT set GOOGLE_APPLICATION_CREDENTIALS — we rely on gcloud ADC
      # mounted above at /root/.config/gcloud/application_default_credentials.json.
      # Setting this env var to a JSON key file is explicitly NOT supported.
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-google}
      - MAX_ITERATIONS=200
      # v2 website pipeline — per-page parallel Claude + visual_dna-driven design.
      # Gates multi-page consumer_website / portfolio / blog / marketplace prompts onto
      # website_pipeline.py. Off → legacy 3-phase flow (single Claude call, slow + generic).
      - WEBSITE_PIPELINE_V2_ENABLED=${WEBSITE_PIPELINE_V2_ENABLED:-true}
      # v2 admin pipeline — React + Vite stack with AuthGuard + Login + Dashboard + per-entity CRUD.
      # ADMIN_PIPELINE_V2_ENABLED=true routes admin_dashboard / crm / tms / saas_dashboard
      # prompts through admin_pipeline.py (grounded research + brand extractor + data model
      # planner + foundation builder + parallel CRUD codegen). Off → legacy Next.js admin.
      - ADMIN_PIPELINE_V2_ENABLED=${ADMIN_PIPELINE_V2_ENABLED:-true}
      # Stage 2 grounded research (2 parallel Gemini Pro + search calls). ~$0.10-0.20 / admin.
      # Set to false for cheap dry runs — research output is enrichment, not gate.
      - ADMIN_RESEARCH_ENABLED=${ADMIN_RESEARCH_ENABLED:-true}
      # Stage 6 CRUD codegen — true writes placeholder JSX (no Anthropic), false calls
      # Claude Sonnet 4.6. Default false now that template-strip + foundation fixes
      # land — real CRUD per entity (~$1-2 / admin generation).
      - ADMIN_CODEGEN_MOCK=${ADMIN_CODEGEN_MOCK:-false}
      - SANDBOX_IMAGE=nikolaik/python-nodejs:python3.11-nodejs20
      - SANDBOX_CONTAINER_PREFIX=lucid-sandbox-
      - SANDBOX_MEMORY_LIMIT=2g
      - SANDBOX_CPU_LIMIT=1.0
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Used by billing_meter to call the frontend's /api/internal/usage endpoint
      # (Docker DNS — service name "frontend" resolves to that container).
      - LUCID_FRONTEND_URL=${LUCID_FRONTEND_URL:-http://frontend:3000}
      # Must match frontend ENCRYPTION_KEY — used to decrypt stored git tokens
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,https://lucid-ai-pearl.vercel.app
      # Public-facing app root used to build the accept-invite link emailed
      # to invitees. Reuses NEXT_PUBLIC_APP_URL when APP_URL isn't set so
      # production only needs to configure one variable.
      - APP_URL=${APP_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
      # Vision-grounded research (Option B).
      # Screenshot service for fetching reference site images.
      # Leave SCREENSHOT_API_KEY empty to disable — pipeline falls back to text-only research.
      # Supported SCREENSHOT_SERVICE values: apiflash (default), screenshotone.
      - SCREENSHOT_API_KEY=${SCREENSHOT_API_KEY:-}
      - SCREENSHOT_SERVICE=${SCREENSHOT_SERVICE:-apiflash}
      # Gemini model used for vision analysis of the screenshots.
      - VISION_RESEARCH_MODEL=${VISION_RESEARCH_MODEL:-gemini-2.5-pro}
      # Max reference screenshots per generation (2-4 recommended).
      - VISION_MAX_REFS=${VISION_MAX_REFS:-3}
      # Preview URL base — nginx proxies /preview-{port}/* → localhost:{port}/*
      # Set to the public HTTPS domain so previews work in the browser iframe.
      # Leave empty for local dev (falls back to http://localhost:{port}).
      - PREVIEW_BASE_URL=${PREVIEW_BASE_URL:-}

volumes:
  frontend_node_modules:
  pnpm_store:
  npm_cache:
