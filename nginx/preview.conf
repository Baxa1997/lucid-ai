# ─────────────────────────────────────────────────────────────────────────────
#  Lucid AI — Preview subdomain proxy
#
#  Routes *.preview.yourdomain.com → the correct dev server port on localhost.
#  The port is encoded in the subdomain so no dynamic config is needed:
#    https://preview-3045.preview.yourdomain.com  →  http://127.0.0.1:3045
#
#  Setup (one-time on the production server):
#
#  1. Copy this file:
#       cp nginx/preview.conf /etc/nginx/sites-available/lucid-preview
#       ln -s /etc/nginx/sites-available/lucid-preview /etc/nginx/sites-enabled/
#
#  2. Replace every occurrence of "preview.yourdomain.com" with your real domain.
#
#  3. Obtain a wildcard SSL cert (DNS challenge required for wildcards):
#       certbot certonly --dns-cloudflare \
#         --dns-cloudflare-credentials ~/.secrets/cloudflare.ini \
#         -d "*.preview.yourdomain.com"
#
#  4. Add a DNS wildcard A record:
#       *.preview.yourdomain.com  →  <your server IP>
#
#  5. Reload Nginx:
#       nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ~^preview-\d+\.preview\.yourdomain\.com$;
    return 301 https://$host$request_uri;
}

# HTTPS — wildcard proxy
server {
    listen 443 ssl;
    # Regex captures the port number from the subdomain
    server_name ~^preview-(?<port>\d+)\.preview\.yourdomain\.com$;

    ssl_certificate     /etc/letsencrypt/live/preview.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.yourdomain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reject ports outside the allocated range (safety guard)
    if ($port !~ ^3[0-9]{3}$) {
        return 400;
    }

    location / {
        proxy_pass http://127.0.0.1:$port;
        proxy_http_version 1.1;

        # WebSocket support — required for Vite HMR and Next.js Fast Refresh
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived connections open (HMR event streams)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Disable buffering for SSE / HMR streams
        proxy_buffering off;
    }
}
