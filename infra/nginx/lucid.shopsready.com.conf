server {
    server_name lucid.shopsready.com;

    # ── Preview port proxy ────────────────────────────────────────────────────
    # Routes /preview-{PORT}/* → localhost:{PORT}/*
    # Required because the browser's origin is lucid.shopsready.com (not
    # localhost:PORT), so all /_next/static/ and /_next/image requests must
    # travel through this proxy to reach the correct Next.js dev server.
    #
    # Named captures: $prv_port = port number, $prv_path = rest of path
    location ~ ^/preview-(?P<prv_port>[0-9]+)(?P<prv_path>/.*)?$ {
        set $prv_path_final $prv_path;
        if ($prv_path_final = "") {
            set $prv_path_final "/";
        }
        proxy_pass http://127.0.0.1:$prv_port$prv_path_final$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$prv_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # Allow iframes from any origin (preview is embedded in the app)
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # ── Main app (FastAPI / ai_engine on port 8000) ───────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lucid.shopsready.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucid.shopsready.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
