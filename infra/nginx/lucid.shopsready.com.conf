server {
    server_name lucid.shopsready.com;

    # ── Preview port proxy ────────────────────────────────────────────────────
    # Routes /preview-{PORT}/* → localhost:{PORT}/*
    # The local_preview service runs Next.js/Vite dev servers on ports 4000-4050
    # inside the ai_engine container (mapped to the host).
    #
    # TWO rules are required:
    #   Rule 1 — Next.js static assets: strip the /preview-{PORT} prefix before
    #            proxying so Next.js receives the plain /_next/... path it expects.
    #
    #   Rule 2 — Everything else: KEEP the /preview-{PORT} prefix when proxying.
    #            Vite uses --base=/preview-{PORT}/ and needs to receive the full
    #            prefixed path (GET /preview-4002/) to serve content directly.
    #            Without this Vite redirects GET / → /preview-{PORT}/ → loop.
    #            Next.js pages also benefit because basePath=/preview-{PORT} is now
    #            patched into next.config so GET /preview-4000/ is served correctly.

    # Rule 1: Next.js static assets — strip prefix, proxy /_next/... directly
    location ~ ^/preview-(?P<nxt_port>[0-9]+)/_next/(?P<nxt_path>.*)$ {
        proxy_pass http://127.0.0.1:$nxt_port/_next/$nxt_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$nxt_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # Rule 2: All other preview paths — keep full prefix (fixes Vite base routing)
    location ~ ^/preview-(?P<prv_port>[0-9]+)(?P<prv_path>/.*)?$ {
        set $prv_path_final $prv_path;
        if ($prv_path_final = "") {
            set $prv_path_final "/";
        }
        proxy_pass http://127.0.0.1:$prv_port/preview-$prv_port$prv_path_final$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$prv_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # Allow iframes from any origin (preview is embedded in the app)
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # ── AI Engine API + WebSocket ─────────────────────────────────────────────
    # Routes /api/v1/* directly to the FastAPI ai_engine (port 8000).
    # Keeps WebSocket connections alive with the Upgrade headers.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Next.js Frontend ──────────────────────────────────────────────────────
    # All other traffic → Next.js frontend container (port 3000).
    # Next.js rewrites /api/ws/* → ai_engine internally via Docker DNS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lucid.shopsready.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucid.shopsready.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name lucid.shopsready.com;
    return 301 https://$host$request_uri;
}
